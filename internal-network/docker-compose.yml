version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: admin-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-fieldstream}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-fieldstream-secret}
      - POSTGRES_DB=${POSTGRES_DB:-fieldstream}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fieldstream}"]
      interval: 5s
      timeout: 5s
      retries: 5

  data-distributor:
    build: ./data-distributor
    container_name: data-distributor
    restart: unless-stopped
    environment:
      - MQTT_HOST=internal-mqtt-broker
      - MQTT_PORT=8883
      - CERT_PATH=/certs
      # InfluxDB Configuration
      - INFLUXDB_URL=${INFLUXDB_URL}
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN}
      - INFLUXDB_ORG=${INFLUXDB_ORG}
      - INFLUXDB_BUCKET=${INFLUXDB_BUCKET}
      # InfluxDB v1.x support (legacy)
      - INFLUXDB_DATABASE=${INFLUXDB_DATABASE}
      - INFLUXDB_USERNAME=${INFLUXDB_USERNAME}
      - INFLUXDB_PASSWORD=${INFLUXDB_PASSWORD}
      # Multi-tenancy: 'tags' (single bucket with tenant tags) or 'buckets' (per-tenant buckets)
      - INFLUX_TENANT_STRATEGY=${INFLUX_TENANT_STRATEGY:-tags}
      - INFLUXDB_RETENTION_DAYS=${INFLUXDB_RETENTION_DAYS:-30}
      # File Storage
      - FILE_STORAGE_PATH=${FILE_STORAGE_PATH:-/data/files}
      - FILE_STORAGE_TYPE=${FILE_STORAGE_TYPE:-local}
    volumes:
      - ../certs:/certs:ro
      - file_storage:/data/files
    networks:
      - internal-net
    depends_on:
      - internal-mqtt-broker

  internal-mqtt-broker:
    image: eclipse-mosquitto:latest
    container_name: internal-mqtt-broker
    restart: unless-stopped
    ports:
      # Expose to host for the DMZ bridge to connect
      - "18883:8883"
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
      - ../certs:/mosquitto/certs:ro
      - internal_mqtt_data:/mosquitto/data
    networks:
      - internal-net

  admin-api:
    build: ./admin-api
    container_name: admin-api
    restart: unless-stopped
    environment:
      - PORT=3001
      - JWT_SECRET=${ADMIN_JWT_SECRET:-change-me}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-fieldstream}:${POSTGRES_PASSWORD:-fieldstream-secret}@postgres:5432/${POSTGRES_DB:-fieldstream}?schema=public
      # OIDC Configuration (optional - disable for dev)
      - OIDC_ENABLED=${OIDC_ENABLED:-false}
      - OIDC_ISSUER_URL=${OIDC_ISSUER_URL}
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID}
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET}
      - OIDC_REDIRECT_URI=${OIDC_REDIRECT_URI}
      - SESSION_SECRET=${SESSION_SECRET:-session-secret-change-me}
      # API Key for programmatic access
      - ADMIN_API_KEY=${ADMIN_API_KEY}
      - NODE_ENV=${NODE_ENV:-development}
    ports:
      - "3001:3001"
    networks:
      - internal-net
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  internal_mqtt_data:
  file_storage:
  postgres_data:

networks:
  internal-net:
    driver: bridge