# FieldStream Internal MQTT Broker ACL Configuration
# This file defines topic-level access control for internal services

# ============================================================
# Default Policy: Deny all unless explicitly allowed
# ============================================================

# ============================================================
# Data Distributor (data-distributor)
# Role: Subscribes to all data topics, processes and stores data
# CN: data-distributor (from certificate)
# ============================================================

# Data Distributor can read all incoming data
user data-distributor
topic read sensors/+/data
topic read events/+/data
topic read files/+/data
topic read commands/+/response
topic read tenants/+/devices/+/sensors/data
topic read tenants/+/devices/+/events/data
topic read tenants/+/devices/+/files/data
topic read tenants/+/devices/+/commands/response

# Data Distributor can publish processed results (if needed)
user data-distributor
topic write processed/+/+

# ============================================================
# Internal Server / Bridge Endpoint (internal-server)
# Role: Receives bridged messages from DMZ
# CN: internal-server (from certificate)
# ============================================================

# Internal server receives all bridged data from DMZ
user internal-server
topic write sensors/+/data
topic write events/+/data
topic write files/+/data
topic write commands/+/response
topic write tenants/+/devices/+/sensors/data
topic write tenants/+/devices/+/events/data
topic write tenants/+/devices/+/files/data
topic write tenants/+/devices/+/commands/response

# Internal server can send commands to DMZ
user internal-server
topic read commands/+/request
topic read tenants/+/devices/+/commands/request

# ============================================================
# Command Service (command-service)
# Role: Sends commands to field devices
# CN: command-service (from certificate)
# ============================================================

user command-service
topic write commands/+/request
topic write tenants/+/devices/+/commands/request
topic read commands/+/response
topic read tenants/+/devices/+/commands/response

# ============================================================
# Analytics Service (analytics-service)
# Role: Read-only access to sensor data for analysis
# CN: analytics-service (from certificate)
# ============================================================

user analytics-service
topic read sensors/+/data
topic read events/+/data
topic read tenants/+/devices/+/sensors/data
topic read tenants/+/devices/+/events/data

# ============================================================
# Admin/Monitoring (should be restricted in production)
# ============================================================

user admin
topic readwrite #
