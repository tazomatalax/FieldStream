# FieldStream DMZ MQTT Broker ACL Configuration
# This file defines topic-level access control for tenant isolation

# ============================================================
# Default Policy: Deny all unless explicitly allowed
# ============================================================

# ============================================================
# WebSocket Server (dmz-server)
# Role: Receives data from field devices, publishes to MQTT
# CN: dmz-server (from certificate)
# ============================================================

# WebSocket server can publish to legacy topics (for backwards compatibility)
user dmz-server
topic write sensors/+/data
topic write events/+/data
topic write files/+/data
topic write commands/+/response

# WebSocket server can publish to tenant-scoped topics
user dmz-server
topic write tenants/+/devices/+/sensors/data
topic write tenants/+/devices/+/events/data
topic write tenants/+/devices/+/files/data
topic write tenants/+/devices/+/commands/response

# WebSocket server can subscribe to command requests (to forward to devices)
user dmz-server
topic read commands/+/request
topic read tenants/+/devices/+/commands/request

# ============================================================
# Bridge Client (dmz-bridge-client)
# Role: Bridges messages from DMZ to Internal network
# CN: dmz-bridge-client (from certificate)
# ============================================================

# Bridge can read all sensor/event/file data to forward internally
user dmz-bridge-client
topic read sensors/+/data
topic read events/+/data
topic read files/+/data
topic read commands/+/response
topic read tenants/+/devices/+/sensors/data
topic read tenants/+/devices/+/events/data
topic read tenants/+/devices/+/files/data
topic read tenants/+/devices/+/commands/response

# Bridge can write command requests from internal network
user dmz-bridge-client
topic write commands/+/request
topic write tenants/+/devices/+/commands/request

# ============================================================
# Pattern-based rules for future device certificates
# If devices connect directly with their own certs
# ============================================================

# Pattern: device-{deviceId} can only access their own topics
# Note: Mosquitto supports pattern substitution with %u (username) and %c (clientId)
pattern write sensors/%u/data
pattern write events/%u/data
pattern write files/%u/data
pattern write commands/%u/response
pattern read commands/%u/request

# ============================================================
# Admin/Monitoring (optional)
# ============================================================

# Admin user for debugging (should be disabled in production)
user admin
topic readwrite #
