server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Docker container logs
  - job_name: containers
    static_configs:
      - targets:
          - localhost
        labels:
          job: containerlogs
          __path__: /var/lib/docker/containers/*/*log

    pipeline_stages:
      - json:
          expressions:
            output: log
            stream: stream
            attrs:
      - json:
          expressions:
            tag:
          source: attrs
      - regex:
          expression: (?P<container_name>(?:[a-zA-Z0-9][a-zA-Z0-9_.-]+))
          source: tag
      - timestamp:
          source: time
          format: RFC3339Nano
      - labels:
          stream:
          container_name:
      - output:
          source: output

  # FieldStream specific logs
  - job_name: fieldstream
    static_configs:
      - targets:
          - localhost
        labels:
          job: fieldstream
          __path__: /var/log/fieldstream/*.log

    pipeline_stages:
      - json:
          expressions:
            level: level
            service: service
            message: message
            tenant_id: tenantId
            device_id: deviceId
            action: action
            audit: audit
      - labels:
          level:
          service:
          tenant_id:
          device_id:
          action:
          audit:
      - timestamp:
          source: timestamp
          format: RFC3339
